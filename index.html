<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aakash Unified - Fixed Date Filter</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui}
.card{background:#1e293b;border:1px solid #334155}
.badge{font-size:10px;padding:2px 8px;border-radius:999px}
.setter{color:#38bdf8}
.reviewer{color:#ffab40}
.dup{background:#7f1d1d;color:#fecaca}
input[type="date"]{color-scheme:dark}
</style>
</head>
<body class="p-4 md:p-6">
<h1 class="text-2xl font-bold">AAKASH UNIFIED TEST PLANNER <span class="text-sm font-normal text-cyan-400">— Date Filter FIXED</span></h1>
<p class="text-sm text-slate-400 mb-4">Syllabus + Setter + Reviewer | Duplicates STILL SHOWN | Date filter now modifies instantly</p>

<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
<div class="card p-3 rounded">Total Tests: <span id="total" class="font-bold"></span></div>
<div class="card p-3 rounded">Batches: <span id="batches" class="font-bold"></span></div>
<div class="card p-3 rounded">Duplicates: <span id="dups" class="font-bold text-red-300"></span></div>
<div class="card p-3 rounded">Filtered: <span id="filtered" class="font-bold text-cyan-300"></span></div>
<div class="card p-3 rounded text-xs">Active Date: <span id="activeDate" class="font-bold"></span></div>
</div>

<div class="card p-4 rounded mb-4">
<div class="flex flex-wrap gap-4 items-end">
<div>
<label class="text-xs block mb-1 font-bold text-cyan-300">From Date (Start)</label>
<input id="from" type="date" value="2026-05-01" class="bg-slate-900 border border-cyan-700 rounded px-3 py-2 text-sm w-[170px]">
</div>
<div>
<label class="text-xs block mb-1 font-bold text-cyan-300">To Date (End)</label>
<input id="to" type="date" value="2026-12-31" class="bg-slate-900 border border-cyan-700 rounded px-3 py-2 text-sm w-[170px]">
</div>
<div>
<label class="text-xs block mb-1">Batch/Class</label>
<select id="batch" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm min-w-[160px]"></select>
</div>
<div>
<label class="text-xs block mb-1">Type</label>
<select id="type" class="bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm min-w-[160px]"></select>
</div>
<div class="flex-1 min-w-[260px]">
<label class="text-xs block mb-1">Search Syllabus / Setter / Reviewer</label>
<input id="search" placeholder="e.g. KALYAN, Gravitation, Cell..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
</div>
</div>
<div class="flex flex-wrap gap-3 mt-3 items-center">
<label class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-1 rounded"><input id="dupOnly" type="checkbox"> Dup only</label>
<label class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-1 rounded"><input id="highlight" type="checkbox" checked> Highlight dup</label>
<button id="apply" class="bg-cyan-600 hover:bg-cyan-500 px-5 py-2 rounded text-sm font-bold">Apply Date Filter</button>
<button id="reset" class="bg-slate-700 px-4 py-2 rounded text-sm">Reset All</button>
<button id="export" class="bg-emerald-700 px-4 py-2 rounded text-sm">Export CSV</button>
<span id="dateMsg" class="text-xs text-yellow-300"></span>
</div>
</div>

<div class="flex gap-2 mb-3">
<button id="btnCard" class="bg-cyan-700 px-3 py-1 rounded text-sm">Card View</button>
<button id="btnTable" class="bg-slate-700 px-3 py-1 rounded text-sm">Table View</button>
</div>

<div id="cards" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>

<div id="tableWrap" class="hidden overflow-auto card rounded">
<table class="min-w-[1800px] w-full text-xs">
<thead class="sticky top-0 bg-slate-800"><tr id="thead"></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="modal" class="fixed inset-0 hidden bg-black/70 p-4 z-50 overflow-auto"><div class="max-w-3xl mx-auto card rounded p-5"><div class="flex justify-between"><h2 id="mTitle" class="text-lg font-bold"></h2><button onclick="document.getElementById('modal').classList.add('hidden')" class="bg-slate-700 px-3 py-1 rounded">X</button></div><div id="mBody" class="mt-4 text-sm space-y-3"></div></div></div>

<script>
let fullData = [];
let FULL_DATA_PLACEHOLDER = null; // will be injected

function parseISO(s){
  if(!s) return null;
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function initWithData(data){
  fullData = data.map(d=>({...d, _date: parseISO(d.start_iso)})).sort((a,b)=> (a._date||new Date(8640000000000000)) - (b._date||new Date(8640000000000000)));
  document.getElementById('total').textContent = fullData.length;
  document.getElementById('batches').textContent = [...new Set(fullData.map(d=>d.batch))].length;
  document.getElementById('dups').textContent = fullData.filter(d=>d.is_duplicate).length;
  
  const batches = [...new Set(fullData.map(d=>d.batch))].sort();
  const types = [...new Set(fullData.map(d=>d.type))].sort();
  const batchSel = document.getElementById('batch');
  batchSel.innerHTML = '<option>All Batches</option>' + batches.map(b=>`<option>${b}</option>`).join('');
  const typeSel = document.getElementById('type');
  typeSel.innerHTML = '<option>All Types</option><option>UT</option><option>TE</option><option>PT</option><option>FT</option><option>AIATS</option><option>AMTS</option><option>NRT</option>' + types.map(t=>`<option>${t}</option>`).join('');

  render();
}

function getFiltered(){
  const fromVal = document.getElementById('from').value;
  const toVal = document.getElementById('to').value;
  const fromDate = fromVal ? new Date(fromVal) : null;
  const toDate = toVal ? new Date(toVal) : null;
  if(toDate) toDate.setHours(23,59,59,999); // inclusive

  const batch = document.getElementById('batch').value;
  const type = document.getElementById('type').value;
  const q = document.getElementById('search').value.toLowerCase();
  const dupOnly = document.getElementById('dupOnly').checked;
  
  document.getElementById('activeDate').textContent = `${fromVal||'--'} to ${toVal||'--'}`;

  return fullData.filter(d=>{
    // DATE FILTER - FIXED LOGIC
    if(fromDate && d._date){
      if(d._date < fromDate) return false;
    }
    if(toDate && d._date){
      if(d._date > toDate) return false;
    }
    if(batch!=='All Batches' && d.batch!==batch) return false;
    if(type!=='All Types'){
      const tl = (d.type||'').toLowerCase();
      const tn = (d.test_name||'').toLowerCase();
      if(!tl.includes(type.toLowerCase()) && !tn.includes(type.toLowerCase())) return false;
    }
    if(dupOnly && !d.is_duplicate) return false;
    if(q){
      const blob = `${d.test_name} ${d.type} ${d.setter} ${d.reviewer} ${d.physics} ${d.chemistry} ${d.botany} ${d.zoology} ${d.maths} ${d.conduction}`.toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const filtered = getFiltered();
  const fromVal = document.getElementById('from').value;
  const toVal = document.getElementById('to').value;
  
  if(fromVal && toVal && fromVal > toVal){
    document.getElementById('dateMsg').textContent = '⚠️ From date is after To date!';
  } else {
    document.getElementById('dateMsg').textContent = `✅ Showing ${filtered.length} tests in selected date range`;
  }

  document.getElementById('filtered').textContent = filtered.length;
  const cards = document.getElementById('cards');
  const highlight = document.getElementById('highlight').checked;
  cards.innerHTML = filtered.map((d,i)=>`
    <div class="card p-4 rounded hover:ring-1 hover:ring-cyan-500 cursor-pointer ${d.is_duplicate && highlight ? 'ring-2 ring-red-400' : ''}" onclick='openModalByIndex(${i})'>
      <div class="flex justify-between gap-2 mb-2">
        <span class="badge bg-slate-700">${d.batch}</span>
        <span class="badge bg-cyan-900">${d.type}</span>
      </div>
      <div class="font-bold text-sm">${d.test_name} <span class="text-xs text-cyan-300">(${d.start_iso})</span></div>
      <div class="text-xs text-slate-400 mb-2">${d.conduction||''} | ${d.source}</div>
      ${d.progress!=='-' && !isNaN(d.progress) ? `<div class="w-full bg-slate-700 h-1 rounded mb-2"><div class="bg-cyan-500 h-1" style="width:${d.progress}%"></div></div>` : ''}
      <div class="text-xs space-y-1">
        <div class="setter">✍️ Setter: <b>${d.setter}</b></div>
        <div class="reviewer">👀 Reviewer: <b>${d.reviewer}</b></div>
        ${d.prep_date!=='-'?`<div>Prep: ${d.prep_date} | Sub: ${d.sub_date}</div>`:''}
      </div>
      <div class="mt-2 text-xs text-slate-300 line-clamp-3">
        <div><b>P:</b> ${ (d.physics||'').substring(0,90)}</div>
        <div><b>C:</b> ${ (d.chemistry||'').substring(0,90)}</div>
        <div><b>B:</b> ${ (d.botany||'').substring(0,90)}</div>
        <div><b>Z:</b> ${ (d.zoology||'').substring(0,90)}</div>
        ${d.maths!=='-'?`<div><b>M:</b> ${(d.maths||'').substring(0,90)}</div>`:''}
      </div>
      ${d.is_duplicate?`<div class="mt-2 badge dup">DUPLICATE x${d.dup_count} - STILL SHOWN</div>`:''}
    </div>
  `).join('');

  // table
  const thead = document.getElementById('thead');
  thead.innerHTML = ['S.No','Start','Batch','Test','Type','Setter','Reviewer','Prep','Sub','Physics','Chemistry','Botany','Zoology','Maths','Progress','Dup','Source'].map(h=>`<th class="p-2 text-left border-b border-slate-700">${h}</th>`).join('');
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = filtered.map((d,i)=>`
    <tr class="${d.is_duplicate && highlight ? 'bg-red-900/30' : ''} border-b border-slate-800 hover:bg-slate-800">
      <td class="p-2">${i+1}</td><td class="p-2 font-bold text-cyan-300">${d.start_iso}</td><td class="p-2">${d.batch}</td><td class="p-2 font-bold">${d.test_name}</td><td class="p-2">${d.type}</td>
      <td class="p-2 setter font-bold">${d.setter}</td><td class="p-2 reviewer font-bold">${d.reviewer}</td><td class="p-2">${d.prep_date}</td><td class="p-2">${d.sub_date}</td>
      <td class="p-2">${d.physics}</td><td class="p-2">${d.chemistry}</td><td class="p-2">${d.botany}</td><td class="p-2">${d.zoology}</td><td class="p-2">${d.maths}</td>
      <td class="p-2">${d.progress}</td><td class="p-2">${d.is_duplicate?'YES x'+d.dup_count:'NO'}</td><td class="p-2">${d.source}</td>
    </tr>
  `).join('');

  window._lastFiltered = filtered;
}

function openModalByIndex(idx){
  const d = window._lastFiltered[idx];
  if(!d) return;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('mTitle').textContent = `${d.test_name} - ${d.batch} (${d.start_iso})`;
  document.getElementById('mBody').innerHTML = `
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div>Setter: <b class="setter">${d.setter}</b></div><div>Reviewer: <b class="reviewer">${d.reviewer}</b></div>
      <div>Prep: ${d.prep_date}</div><div>Sub: ${d.sub_date}</div>
      <div>Conduction: ${d.conduction}</div><div>Progress: ${d.progress}%</div>
      <div>Source: ${d.source}</div><div>Duplicate: ${d.is_duplicate?'YES x'+d.dup_count:'NO'} (still shown)</div>
    </div>
    <div class="mt-3 text-xs"><b>Timeline:</b> <span class="setter">${d.setter}</span> → Prep (${d.prep_date}) → <span class="reviewer">${d.reviewer}</span> → Sub (${d.sub_date}) → <span class="text-cyan-300 font-bold">Conduction (${d.start_iso})</span></div>
    <div class="grid gap-3 mt-3">
      <div class="card p-2 rounded"><b>🌿 Botany:</b> ${d.botany}</div>
      <div class="card p-2 rounded"><b>🐾 Zoology:</b> ${d.zoology}</div>
      <div class="card p-2 rounded"><b>⚡ Physics:</b> ${d.physics}</div>
      <div class="card p-2 rounded"><b>🧪 Chemistry:</b> ${d.chemistry}</div>
      ${d.maths!=='-'?`<div class="card p-2 rounded"><b>🔢 Maths:</b> ${d.maths}</div>`:''}
    </div>
  `;
}

// FIXED: Listen to both input AND change events for date
['from','to'].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener('change', render);
  el.addEventListener('input', render);
});
['batch','type','search','dupOnly','highlight'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

document.getElementById('apply').onclick = render;
document.getElementById('reset').onclick = ()=>{
  document.getElementById('from').value='2026-05-01';
  document.getElementById('to').value='2026-12-31';
  document.getElementById('batch').value='All Batches';
  document.getElementById('type').value='All Types';
  document.getElementById('search').value='';
  document.getElementById('dupOnly').checked=false;
  render();
};
document.getElementById('export').onclick = ()=>{
  const filtered = window._lastFiltered || [];
  const headers = ['Start','Batch','Test','Type','Setter','Reviewer','Prep','Sub','Physics','Chemistry','Botany','Zoology','Maths','Progress','Duplicate','Source','Conduction'];
  const rows = filtered.map(d=>[d.start_iso,d.batch,d.test_name,d.type,d.setter,d.reviewer,d.prep_date,d.sub_date,d.physics,d.chemistry,d.botany,d.zoology,d.maths,d.progress,d.is_duplicate?'YES x'+d.dup_count:'NO',d.source,d.conduction]);
  const csv = [headers.join(','), ...rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aakash_unified_filtered.csv'; a.click();
};
document.getElementById('btnCard').onclick = ()=>{document.getElementById('cards').classList.remove('hidden'); document.getElementById('tableWrap').classList.add('hidden')};
document.getElementById('btnTable').onclick = ()=>{document.getElementById('tableWrap').classList.remove('hidden'); document.getElementById('cards').classList.add('hidden')};
</script>
